name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: pnpm migration:compare
      - run: pnpm build
        env:
          E2E_COMPILE: '1'
          AUTH_SECRET: e2e-build
          AUTH_GITHUB_ID: e2e-build
          AUTH_GITHUB_SECRET: e2e-build
          DATABASE_URL: http://unused.invalid
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm playwright test
